<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Usage Robot 配对</title>
  <style>
    :root { color-scheme: light dark; font-family: "Segoe UI", sans-serif; }
    body { margin: 0; min-width: 340px; background: Canvas; color: CanvasText; }
    main { padding: 22px; max-width: 520px; }
    h1 { font-size: 19px; margin: 0 0 8px; }
    p { font-size: 13px; line-height: 1.55; opacity: .82; }
    label { display: block; font-size: 12px; margin: 18px 0 6px; }
    .row { display: flex; gap: 8px; }
    input { flex: 1; font: 600 20px Consolas, monospace; letter-spacing: 4px; padding: 9px; min-width: 0; }
    button { padding: 0 16px; font-weight: 600; }
    #status { min-height: 20px; font-size: 13px; margin-top: 12px; }
    .ok { color: #20a56a; } .error { color: #d14b4b; }
  </style>
</head>
<body>
<main>
  <h1>连接 AI Usage Robot</h1>
  <p>在桌面机器人上右键，选择“复制扩展配对码”，然后粘贴下方。扩展不会读取 Cookie、登录令牌或聊天内容。</p>
  <label for="code">6 位配对码（5 分钟内有效）</label>
  <div class="row"><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button id="pair">配对</button></div>
  <div id="status" role="status"></div>
  <p id="syncStatus">定时同步：每 5 分钟</p>
</main>
<script src="options.js"></script>
</body>
</html>
